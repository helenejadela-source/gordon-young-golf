name: Decode images
on:
  push:
    paths: ['img-b64/**']
  workflow_dispatch:
concurrency: decode
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p img
          for f in img-b64/*.b64; do base64 -d "$f" > "img/$(basename "$f" .b64)"; done
          git rm -rq img-b64
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add img
          git commit -m "Decode web images"
          git pull --rebase && git push
